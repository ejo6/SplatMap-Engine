# S2: SAM 3 video masks + tracks (KAN-36). Weights: facebook/sam3 (gated, needs HF_TOKEN)
# After create: pip install -e /workspace/src/sam3
name: sam3
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1
      - torchvision==0.22.1
      - opencv-python
      - einops
      - pycocotools
      - decord==0.6.0
      - psutil
      # pipeline/s2_masks.py runs SAM 3 through transformers (Sam3VideoModel), not the repo's predictor
      - transformers==5.24.0
      - accelerate==1.13.0
      - kernels==0.18.3  # without it SAM 3 skips NMS (duplicate tracks), hole filling and sprinkle removal
